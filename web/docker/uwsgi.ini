[uwsgi]
# Debian's uwsgi loads the Python 3 interpreter as a plugin
plugins = python3
chdir=/webapp/api
chdir2=/webapp/api
master = true

module=wsgi
callable=app
buffer-size=65535
lazy=true

socket = /run/uwsgi.sock
chown-socket = nginx:nginx
chmod-socket = 664
cheaper = 2
processes = 16

py-autoreload = 1
